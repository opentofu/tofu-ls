name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version-file:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Fork tags look like v<upstream version>+<short commit>, e.g. v0.5.3+158d88e
      - name: Check tag against version file, upstream tag and commit
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          base="${tag%%+*}"
          file="$(cat version/VERSION)"
          if [ "$base" != "$file" ]; then
            echo "Tag version ($base) does not match file version ($file)"
            exit 1
          fi
          if [ "$tag" != "$base+$(git rev-parse --short=7 HEAD)" ]; then
            echo "Tag $tag must be v$base+<7-char hash of the tagged commit>"
            exit 1
          fi
          git fetch --no-tags https://github.com/opentofu/tofu-ls.git "refs/tags/v$base:refs/tags/upstream-v$base"
          git merge-base --is-ancestor "upstream-v$base" HEAD || {
            echo "Tagged commit does not contain upstream v$base"
            exit 1
          }
          echo "Version check passed: $tag"

  goreleaser:
    needs: check-version-file
    runs-on: ubuntu-latest
    env:
      flags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Determine Go version
        id: go
        uses: ./.github/actions/go-version
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
